<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="main.css">  
    <script defer src="main.js"></script>
    <title>Document</title>
</head>
<body> 
    <div class="header">
        <h1>Assets Management</h1>
    </div>  
    <div class="main">
        <div class="menu">
            <button id="addButton" onclick="handleClick(this.id)">Add asset</button>
            <button id="tableButton" onclick="handleClick(this.id)">Assets table</button>
            <button id="infoButton" onclick="handleClick(this.id)">Asset info</button>
        </div>
        <div class="content">
            <div id="addButtonSection" data-content class="active">
                <h2>Add asset</h2>
                <form id="assetForm">
                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" id="name" placeholder="Enter asset name" required>
                    </div>
                    <div class="form-group">
                        <label for="price">Price</label>
                        <input type="number" id="price" placeholder="Enter price" required>
                    </div>
                    <div class="form-group">
                        <label for="holder">Holder</label>
                        <input type="text" id="holder" placeholder="Enter holder" required>
                    </div>
                    <button id="addAsset" type="button">ADD</button>
                </form>
            </div>
            <div id="tableButtonSection" data-content>
                <h2>Assets table</h2>
                <table id="data-table" class="assetTable"></table>
            </div>
            <div id="infoButtonSection" data-content>
                <h2>Asset info</h2>
            </div>
        </div>
    </div>    
</body>
</html>
